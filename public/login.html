<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TODO - ログイン</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="login.css" />
</head>

<body class="min-h-screen flex flex-col font-body-md text-on-background bg-surface-lowest relative overflow-hidden">
  <!-- Decorative background bubbles -->
  <div class="bubble-tr"></div>
  <div class="bubble-bl"></div>

  <!-- TopAppBar -->
  <header
    class="bg-pastel-blue h-header-height w-full flex items-center justify-center px-container-margin shrink-0 relative z-10">
    <h1 class="font-display-header text-display-header text-white" style="color: #FFF100;">TODO</h1>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow flex flex-col items-center justify-center p-gutter w-full max-w-[800px] mx-auto relative z-10">
    <div
      class="w-full max-w-md bg-[#f9f9f9] p-container-margin rounded-xl border-2 border-[#a0d8ef] flex flex-col gap-[24px]">
      <div class="text-center mb-[8px]">
        <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-pastel-blue">ログイン</h2>
      </div>

      <!-- Error Message Box -->
      <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm"
        role="alert"></div>

      <!-- Input Form -->
      <form id="loginForm" class="flex flex-col gap-[16px]">
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-pastel-blue sr-only" for="email">メールアドレス</label>
          <input
            class="w-full bg-[#fff9c4] border-2 border-[#a0d8ef] p-input-padding font-input-text text-[#1e293b] placeholder:text-[#1e293b]/50 input-focus-ring rounded-lg transition-all duration-200"
            id="email" name="email" placeholder="メールアドレス" required="" type="email" autocomplete="email" />
        </div>
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-pastel-blue sr-only" for="password">パスワード</label>
          <div class="relative w-full">
            <input
              class="w-full bg-[#fff9c4] border-2 border-[#a0d8ef] p-input-padding pr-[48px] font-input-text text-[#1e293b] placeholder:text-[#1e293b]/50 input-focus-ring rounded-lg transition-all duration-200"
              id="password" name="password" placeholder="パスワード" required="" type="password"
              autocomplete="current-password" />
            <button type="button" id="btnTogglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-pastel-blue hover:opacity-80 focus:outline-none">
              <span id="passwordIcon" class="material-symbols-outlined text-[24px]">visibility_off</span>
            </button>
          </div>
        </div>
        <!-- Action Buttons Area -->
        <div class="flex items-center justify-end mt-[16px]">
          <button id="btnLogin"
            class="bg-[#a0d8ef] text-white font-label-bold text-label-bold px-container-margin py-[12px] min-h-[48px] rounded-lg hover:bg-[#426ab3] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
            type="submit">
            <span id="btnText">ログイン</span>
            <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Bottom Actions -->
  <div
    class="w-full p-container-margin flex flex-col items-center justify-center bg-transparent shrink-0 mt-auto relative z-10">
    <button id="btnGoogleLogin"
      class="w-full max-w-md bg-[#f9f9f9] border-2 border-[#a0d8ef] text-pastel-blue font-label-bold text-label-bold min-h-[48px] flex items-center justify-center gap-base hover:bg-[#426ab3] hover:text-white transition-all duration-200 rounded-full"
      type="button">
      <svg height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          fill="#4285F4"></path>
        <path
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          fill="#34A853"></path>
        <path
          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          fill="#FBBC05"></path>
        <path
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          fill="#EA4335"></path>
        <path d="M1 1h22v22H1z" fill="none"></path>
      </svg>
      <span>Googleでログイン</span>
    </button>
    <a
      href="create.html"
      class="mt-[16px] bg-[#a0d8ef] text-white font-label-bold text-label-bold px-container-margin py-[12px] min-h-[48px] rounded-lg hover:bg-[#426ab3] active:scale-95 transition-all duration-200 flex items-center justify-center w-full max-w-md mx-auto"
    >
      アカウントをお持ちでない方はこちら
    </a>
  </div>

  <!-- Login Logic Script -->
  <script type="module" src="login.js"></script>
</body>

</html>
