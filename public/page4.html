<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TODO - タスク追加 (画面4)</title>
  <meta name="description" content="TODO Web Application - タスク追加画面" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="page2.css?v=4" />
  <style>
    .icon-filled {
      font-variation-settings: 'FILL' 1;
    }
    .input-focus-ring:focus {
      outline: none;
      border-width: 3px !important;
      border-color: #0000ff !important;
    }
  </style>
</head>

<body class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-surface relative overflow-x-hidden" style="background-color: rgb(255, 255, 255);">
  <!-- Decorative background bubbles -->
  <div class="bubble-top-right"></div>
  <div class="bubble-bottom-left"></div>

  <!-- TopAppBar -->
  <header class="bg-[#a0d8ef] h-header-height w-full flex items-center justify-between px-4 md:px-container-margin fixed top-0 left-0 z-50 shadow-sm">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <a href="login.html" class="font-display-header text-display-header tracking-wider font-bold" style="color: rgb(240, 230, 140);">TODO</a>
    </div>

    <!-- Screen Navigation Links -->
    <nav class="flex items-center gap-1 sm:gap-2" aria-label="画面ナビゲーション">
      <a href="login.html" class="px-2.5 sm:px-3 py-1 rounded-full text-xs sm:text-sm font-semibold transition-all text-[#0000ff] hover:bg-white/30 font-label-bold">画面1</a>
      <a href="page2.html" class="px-2.5 sm:px-3 py-1 rounded-full text-xs sm:text-sm font-semibold transition-all text-[#0000ff] hover:bg-white/30 font-label-bold">画面2</a>
      <a href="page3.html" class="px-2.5 sm:px-3 py-1 rounded-full text-xs sm:text-sm font-semibold transition-all text-[#0000ff] hover:bg-white/30 font-label-bold">画面3</a>
      <a href="page4.html" class="px-2.5 sm:px-3 py-1 rounded-full text-xs sm:text-sm font-semibold transition-all bg-[#0000ff] text-[#e1ff00] shadow-sm font-label-bold" aria-current="page">画面4</a>
    </nav>
  </header>

  <!-- Main Content Canvas -->
  <main class="flex-grow pt-header-height flex flex-col items-center justify-center px-container-margin w-full max-w-[800px] mx-auto py-10 relative z-10">
    <div class="w-full bg-surface p-6 sm:p-8 border-2 border-[#a0d8ef] rounded-3xl shadow-sm">
      <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-[#454558] mb-6 text-center">タスク新規追加</h2>
      
      <!-- Input Form -->
      <form id="task-form" class="flex flex-col gap-6" novalidate>
        <!-- Task Name Input -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-primary" for="task-name">
            タスク名 <span class="text-error font-bold">*</span>
          </label>
          <input
            class="w-full bg-[#fffacd] rounded-2xl border-2 border-[#a0d8ef] text-primary font-input-text text-input-text p-4 px-6 focus:border-[3px] focus:outline-none placeholder:text-primary/40 transition-all duration-200"
            id="task-name"
            name="task-name"
            placeholder="タスク名を入力"
            type="text"
            required
          />
          <p id="task-name-error" class="text-error text-xs mt-1 px-2 hidden font-medium"></p>
        </div>

        <!-- Task Description Input -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-primary" for="task-desc">
            タスク内容 <span class="text-error font-bold">*</span>
          </label>
          <textarea
            class="w-full bg-[#fffacd] rounded-2xl border-2 border-[#a0d8ef] text-primary font-input-text text-input-text p-4 px-6 focus:border-[3px] focus:outline-none placeholder:text-primary/40 transition-all duration-200 resize-y"
            id="task-desc"
            name="task-desc"
            placeholder="タスクの詳細を入力"
            rows="5"
            required
          ></textarea>
          <p id="task-desc-error" class="text-error text-xs mt-1 px-2 hidden font-medium"></p>
        </div>

        <!-- 全体エラー / ログイン催促メッセージエリア -->
        <div id="general-error" class="hidden p-3 bg-error-container text-error rounded-xl text-sm font-medium text-center"></div>

        <!-- Actions Container -->
        <div class="flex justify-end items-center mt-4 gap-4">
          <button
            id="cancel-btn"
            class="border-2 border-[#a0d8ef] text-[#426AB3] rounded-full font-label-bold text-label-bold min-h-[48px] px-8 py-3 hover:bg-[#a0d8ef]/20 transition-all flex items-center justify-center cursor-pointer"
            type="button"
          >
            キャンセル
          </button>
          <button
            id="add-task-btn"
            class="bg-[#a0d8ef] text-white hover:bg-[#8ac6de] active:scale-95 rounded-full font-label-bold text-label-bold min-h-[48px] px-8 py-3 transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
            type="submit"
          >
            <span id="add-task-btn-text">追加</span>
            <span class="material-symbols-outlined text-[20px]">add_task</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Task Creation Logic Script -->
  <script type="module" src="page4.js?v=1"></script>
</body>

</html>
