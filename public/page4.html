<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TODO - タスク追加 (画面4)</title>
  <meta name="description" content="TODO Web Application - タスク追加画面" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-fixed-dim": "#bec2ff",
            "surface-container-high": "#e8e8e8",
            "on-tertiary-fixed": "#410000",
            "primary": "#0001bb",
            "on-secondary-fixed": "#1d1d00",
            "inverse-primary": "#bec2ff",
            "on-error": "#ffffff",
            "error": "#ba1a1a",
            "inverse-on-surface": "#f0f1f1",
            "border-primary": "#0000ff",
            "outline": "#757589",
            "on-primary-fixed": "#00006e",
            "surface-container": "#eeeeee",
            "tertiary-container": "#9d0002",
            "on-tertiary": "#ffffff",
            "secondary-fixed-dim": "#cdcd00",
            "primary-fixed": "#e0e0ff",
            "background": "#f9f9f9",
            "surface-container-highest": "#e2e2e2",
            "primary-container": "#0000ff",
            "on-surface": "#1a1c1c",
            "on-tertiary-fixed-variant": "#930002",
            "text-on-accent": "#666600",
            "on-secondary-fixed-variant": "#494900",
            "on-surface-variant": "#454558",
            "on-primary": "#ffffff",
            "surface-container-low": "#f3f3f4",
            "on-error-container": "#93000a",
            "on-primary-container": "#b3b7ff",
            "surface-bright": "#f9f9f9",
            "surface-dim": "#dadada",
            "on-tertiary-container": "#ffa598",
            "on-primary-fixed-variant": "#0000ef",
            "tertiary-fixed-dim": "#ffb4a9",
            "surface": "#f9f9f9",
            "secondary-fixed": "#eaea0a",
            "tertiary": "#720001",
            "outline-variant": "#c5c4db",
            "secondary": "#626200",
            "on-secondary": "#ffffff",
            "surface-lowest": "#ffffff",
            "inverse-surface": "#2f3131",
            "surface-tint": "#343dff",
            "surface-variant": "#e2e2e2",
            "secondary-container": "#e7e700",
            "tertiary-fixed": "#ffdad5",
            "error-container": "#ffdad6",
            "surface-container-lowest": "#ffffff",
            "on-background": "#1a1c1c",
            "on-secondary-container": "#666600",
            "pastel-blue": "#a0d8ef"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "stack-gap": "24px",
            "container-margin": "24px",
            "input-padding": "16px 20px",
            "base-gap": "8px",
            "gutter": "16px",
            "header-height": "64px"
          },
          fontFamily: {
            "headline-lg-mobile": ["Work Sans", "sans-serif"],
            "input-text": ["Work Sans", "sans-serif"],
            "headline-lg": ["Work Sans", "sans-serif"],
            "display-header": ["Work Sans", "sans-serif"],
            "label-bold": ["Work Sans", "sans-serif"],
            "body-md": ["Work Sans", "sans-serif"]
          },
          fontSize: {
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "input-text": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
            "display-header": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700" }],
            "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #ffffff;
    }

    .main-container {
      max-width: 800px;
      margin: 0 auto;
      min-height: calc(100vh - 64px);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-width: 3px !important;
      border-color: #0000ff !important;
    }

    ::placeholder {
      color: rgba(0, 0, 255, 0.4) !important;
    }

    .icon-filled {
      font-variation-settings: 'FILL' 1;
    }
  </style>
</head>

<body
  class="bg-surface-container-lowest font-body-md text-on-surface antialiased flex flex-col min-h-screen relative overflow-x-hidden">
  <!-- Decorative Bubbles -->
  <!-- Top Right Pastel Blue Bubble -->
  <svg class="fixed top-24 right-4 md:right-16 w-40 h-40 -z-10 text-[#a0d8ef] opacity-80 pointer-events-none"
    fill="currentColor" viewBox="0 0 100 100">
    <path
      d="M50 10 C22.4 10 0 27.9 0 50 C0 64.7 9.8 77.6 25 84.7 C25.8 89.6 22 98 22 98 C22 98 33 97 42.4 89.2 C44.8 89.7 47.4 90 50 90 C77.6 90 100 72.1 100 50 C100 27.9 77.6 10 50 10 Z">
    </path>
  </svg>
  <!-- Bottom Left Yellow Bubble -->
  <svg class="fixed bottom-24 left-4 md:left-16 w-56 h-56 -z-10 text-[#fff59d] opacity-80 pointer-events-none"
    fill="currentColor" viewBox="0 0 100 100">
    <path
      d="M50 10 C77.6 10 100 27.9 100 50 C100 64.7 90.2 77.6 75 84.7 C74.2 89.6 78 98 78 98 C78 98 67 97 57.6 89.2 C55.2 89.7 52.6 90 50 90 C22.4 90 0 72.1 0 50 C0 27.9 22.4 10 50 10 Z">
    </path>
  </svg>

  <!-- TopAppBar -->
  <header
    class="bg-[#a0d8ef] h-[64px] w-full flex items-center justify-between px-4 md:px-container-margin fixed top-0 left-0 z-50 shadow-sm">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <a href="login.html" class="font-display-header text-display-header tracking-wider font-bold"
        style="color: rgb(240, 230, 140);">TODO</a>
    </div>

    <!-- Trailing Action -->
    <button
      id="account-btn"
      class="text-[#0000ff] hover:opacity-80 transition-opacity flex items-center justify-center cursor-pointer"
      type="button" aria-label="アカウント">
      <span class="material-symbols-outlined icon-filled" style="font-size: 28px;">account_circle</span>
    </button>
  </header>

  <!-- Main Content Canvas -->
  <main class="main-container w-full mt-header-height px-container-margin pt-8 md:pt-16 pb-12">
    <div class="w-full bg-transparent">
      <!-- Input Form (Design Only, Submissions Prevented) -->
      <form class="flex flex-col gap-6" onsubmit="return false;">
        <!-- Task Name Input -->
        <div class="flex flex-col gap-base-gap">
          <label class="font-label-bold text-label-bold text-primary" for="task-name">タスク名</label>
          <input
            class="w-full bg-[#fffde7] rounded-2xl border-2 border-[#a0d8ef] text-primary font-input-text text-input-text p-[16px_20px] transition-all duration-200"
            id="task-name" name="task-name" placeholder="タスクを入力" type="text" />
        </div>

        <!-- Task Description Input -->
        <div class="flex flex-col gap-base-gap">
          <label class="font-label-bold text-label-bold text-primary" for="task-desc">内容</label>
          <textarea
            class="w-full bg-[#fffde7] rounded-2xl border-2 border-[#a0d8ef] text-primary font-input-text text-input-text p-[16px_20px] transition-all duration-200 resize-y"
            id="task-desc" name="task-desc" placeholder="タスクの詳細を記述" rows="6"></textarea>
        </div>

        <!-- Actions Container -->
        <div class="flex justify-end items-center mt-4 gap-3">
          <button
            class="border-2 border-[#a0d8ef] text-primary rounded-full font-label-bold text-label-bold min-h-[48px] px-8 py-3 hover:opacity-80 transition-opacity flex items-center justify-center cursor-pointer"
            type="button">
            キャンセル
          </button>
          <button
            class="bg-[#a0d8ef] rounded-full font-label-bold text-label-bold min-h-[48px] px-8 py-3 hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 text-on-primary cursor-pointer"
            type="button">
            <span>追加</span>
            <span class="material-symbols-outlined text-[20px]">add_task</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay"
    class="fixed inset-0 bg-black/40 z-[60] opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed right-0 top-0 h-full w-[280px] z-[70] bg-[#f4f3f3] shadow-[-4px_0_24px_rgba(0,0,0,0.08)] flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
    <!-- Sidebar Header -->
    <div class="h-[64px] flex items-center px-6 border-b border-[#c5c4db]/30">
      <span class="material-symbols-outlined icon-filled text-[#0000ff] mr-3" style="font-size: 28px;">account_circle</span>
      <span class="font-label-bold text-label-bold text-on-surface">アカウント</span>
    </div>

    <!-- Sidebar Content (empty for future features) -->
    <div class="flex-1 px-6 py-6">
      <!-- 将来の機能追加エリア -->
    </div>

    <!-- Sidebar Footer - Logout -->
    <div class="px-6 py-6 border-t border-[#c5c4db]/30">
      <button id="logout-btn"
        class="w-full py-3 px-6 rounded-full text-[#ba1a1a] font-label-bold text-label-bold hover:bg-[#ffdad6] transition-colors duration-200 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-sm">logout</span>
        ログアウト
      </button>
    </div>
  </aside>

  <!-- Logout Confirmation Modal -->
  <div id="logout-modal"
    class="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-opacity duration-200">
    <div data-modal-box
      class="bg-white rounded-2xl p-8 shadow-xl max-w-sm w-[90%] flex flex-col items-center gap-6 transform scale-95 transition-transform duration-200">
      <span class="material-symbols-outlined text-[#ba1a1a]" style="font-size: 40px;">logout</span>
      <p class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center">本当にログアウトしますか？</p>
      <div class="flex gap-4 w-full">
        <button id="logout-no"
          class="flex-1 py-3 px-6 rounded-full border-2 border-[#a0d8ef] text-on-surface font-label-bold text-label-bold hover:bg-[#a0d8ef]/10 transition-colors duration-200">
          いいえ
        </button>
        <button id="logout-yes"
          class="flex-1 py-3 px-6 rounded-full bg-[#ba1a1a] text-white font-label-bold text-label-bold hover:opacity-90 transition-opacity duration-200">
          はい
        </button>
      </div>
    </div>
  </div>

  <!-- Sidebar Logic -->
  <script src="sidebar.js"></script>
</body>

</html>
