<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>カテゴリー - TODO</title>
  <meta name="description" content="TODO Web Application - カテゴリー一覧画面" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="login.css" />
  <style>
    .icon-filled {
      font-variation-settings: 'FILL' 1;
    }
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
  </style>
</head>

<body class="bg-surface-lowest min-h-screen flex flex-col font-body-md text-on-background relative overflow-x-hidden">
  <!-- Decorative background bubbles -->
  <div class="bubble-tr"></div>
  <div class="bubble-bl"></div>

  <!-- TopAppBar -->
  <header
    class="bg-pastel-blue h-header-height w-full flex items-center justify-center px-4 md:px-container-margin fixed top-0 left-0 z-50 shadow-sm">
    <!-- Brand / Title -->
    <a href="main.html" class="font-display-header text-display-header text-white"
      style="color: #FFF100;">TODO</a>

    <!-- Trailing Action -->
    <button id="account-btn"
      class="absolute right-4 md:right-container-margin text-[#0000ff] bg-white rounded-full hover:opacity-80 transition-opacity flex items-center justify-center cursor-pointer"
      type="button" aria-label="アカウント">
      <span class="material-symbols-outlined icon-filled" style="font-size: 28px;">account_circle</span>
    </button>
  </header>

  <!-- Main Content Canvas -->
  <main
    class="w-full max-w-[800px] mx-auto pt-[88px] pb-[120px] px-container-margin md:pb-container-margin flex flex-col items-center relative z-10">

    <!-- Page Header -->
    <div class="w-full flex items-center justify-between mb-6">
      <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">カテゴリー</h1>
    </div>

    <!-- Category List Container -->
    <div id="category-list" class="w-full flex flex-col gap-[12px]">
      <!-- Loading State -->
      <div id="category-loading" class="w-full flex flex-col items-center justify-center py-16 text-[#757589] gap-3">
        <span class="material-symbols-outlined animate-spin text-[36px] text-[#0000ff]">progress_activity</span>
        <p class="font-body-md text-sm font-medium">カテゴリーを読み込み中...</p>
      </div>
    </div>

    <!-- Add Category Button -->
    <div class="w-full mt-4">
      <button id="add-category-btn"
        type="button"
        class="w-full flex items-center justify-center gap-2 py-4 border-2 border-dashed border-[#a0d8ef] rounded-3xl text-[#0000ff] font-label-bold text-label-bold hover:bg-[#a0d8ef]/10 transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[20px]">add</span>
        カテゴリーを追加
      </button>
    </div>
  </main>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay"
    class="fixed inset-0 bg-black/40 z-[60] opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed right-0 top-0 h-full w-[280px] z-[70] bg-[#f4f3f3] shadow-[-4px_0_24px_rgba(0,0,0,0.08)] flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
    <!-- Sidebar Header -->
    <div class="h-[64px] flex items-center px-6 border-b border-[#c5c4db]/30">
      <span class="material-symbols-outlined icon-filled text-[#0000ff] mr-3"
        style="font-size: 28px;">account_circle</span>
      <span class="font-label-bold text-label-bold text-on-surface">アカウント</span>
    </div>

    <!-- Sidebar Content -->
    <div class="flex-1 px-6 py-6">
      <nav class="flex flex-col gap-1">
        <a href="dust.html" class="flex items-center gap-2 px-4 py-3 rounded-full transition-all hover:bg-[#e2e2e2] w-full text-on-surface">
          <span class="material-symbols-outlined">delete</span>
          <span class="font-label-bold">ゴミ箱</span>
        </a>
        <a href="categories.html" class="flex items-center gap-2 px-4 py-3 rounded-full transition-all bg-[#e2e2e2] w-full text-on-surface" aria-current="page">
          <span class="material-symbols-outlined">label</span>
          <span class="font-label-bold">カテゴリー</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar Footer - Logout -->
    <div class="px-6 py-6 border-t border-[#c5c4db]/30">
      <button id="logout-btn"
        class="w-full py-3 px-6 rounded-full text-[#ba1a1a] font-label-bold text-label-bold hover:bg-[#ffdad6] transition-colors duration-200 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-sm">logout</span>
        ログアウト
      </button>
    </div>
  </aside>

  <!-- Logout Confirmation Modal -->
  <div id="logout-modal"
    class="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-opacity duration-200">
    <div data-modal-box
      class="bg-white rounded-2xl p-8 shadow-xl max-w-sm w-[90%] flex flex-col items-center gap-6 transform scale-95 transition-transform duration-200">
      <span class="material-symbols-outlined text-[#ba1a1a]" style="font-size: 40px;">logout</span>
      <p class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center">本当にログアウトしますか？</p>
      <div class="flex gap-4 w-full">
        <button id="logout-yes"
          class="flex-1 py-3 px-6 rounded-full bg-[#ba1a1a] text-white font-label-bold text-label-bold hover:opacity-90 transition-opacity duration-200">
          はい
        </button>
        <button id="logout-no"
          class="flex-1 py-3 px-6 rounded-full border-2 border-[#a0d8ef] text-on-surface font-label-bold text-label-bold hover:bg-[#a0d8ef]/10 transition-colors duration-200">
          いいえ
        </button>
      </div>
    </div>
  </div>

  <!-- Category Create Modal -->
  <div id="create-category-modal-overlay"
    class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="create-category-modal-box"
      class="bg-[#f9f9f9] w-[90%] max-w-[400px] rounded-3xl border-2 border-[#a0d8ef] p-6 shadow-lg flex flex-col gap-5 transform scale-95 transition-transform duration-200">
      <div class="text-center">
        <span class="material-symbols-outlined text-[#0000ff] text-[40px] mb-1">label</span>
        <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">新しいカテゴリー</h2>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-label-bold text-label-bold text-primary" for="new-category-name">
          カテゴリー名 <span class="text-error font-bold">*</span>
        </label>
        <input
          id="new-category-name"
          type="text"
          maxlength="30"
          placeholder="カテゴリー名を入力（最大30文字）"
          class="w-full bg-[#fff9c4] rounded-2xl border-2 border-[#a0d8ef] text-[#1e293b] font-input-text text-[16px] p-3 px-5 focus:border-[3px] focus:border-[#0000ff] focus:outline-none placeholder:text-[#1e293b]/50 transition-all duration-200"
        />
        <p id="create-category-error" class="text-error text-xs px-1 hidden font-medium"></p>
      </div>
      <div class="flex gap-4">
        <button id="create-category-cancel"
          class="flex-1 py-3 rounded-3xl bg-[#f9f9f9] text-[#1e293b] border border-[#a0d8ef] font-label-bold cursor-pointer hover:bg-[#e2e2e2] transition-colors">
          キャンセル
        </button>
        <button id="create-category-submit"
          class="flex-1 py-3 rounded-3xl bg-[#a0d8ef] text-white border-none font-label-bold cursor-pointer hover:bg-[#426ab3] transition-colors">
          作成
        </button>
      </div>
    </div>
  </div>

  <!-- Category Delete Confirmation Modal -->
  <div id="delete-category-modal-overlay"
    class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="delete-category-modal-box"
      class="bg-[#f9f9f9] w-[90%] max-w-[400px] rounded-3xl border-2 border-[#a0d8ef] p-6 shadow-lg flex flex-col gap-6 transform scale-95 transition-transform duration-200">
      <div class="text-center">
        <span class="material-symbols-outlined text-[#ba1a1a] text-[48px] mb-2">warning</span>
        <p class="text-on-surface font-bold text-[18px]" id="delete-category-title">カテゴリーを削除しますか？</p>
        <p class="text-on-surface-variant text-[13px] mt-3 leading-relaxed">
          このカテゴリーを使用しているタスクからカテゴリーが解除されます。<br>タスク自体は削除されません。
        </p>
      </div>
      <div class="flex gap-4">
        <button id="delete-category-yes"
          class="flex-1 py-3 rounded-2xl bg-[#ff0000] text-[#ffffff] border-none font-label-bold cursor-pointer hover:opacity-90 transition-opacity">
          はい
        </button>
        <button id="delete-category-no"
          class="flex-1 py-3 rounded-2xl bg-[#f9f9f9] text-[#1e293b] border border-[#a0d8ef] font-label-bold cursor-pointer hover:bg-[#e2e2e2] transition-colors">
          いいえ
        </button>
      </div>
    </div>
  </div>

  <!-- Sidebar Logic -->
  <script src="sidebar.js"></script>
  <!-- Categories Logic -->
  <script type="module" src="categories.js"></script>
</body>

</html>
