  <!-- Delete Flow Logic -->
  <script>
    (function () {
      const deleteModal = document.getElementById('delete-modal');
      const deleteModalBox = document.getElementById('delete-modal-box');
      const deleteModalTaskName = document.getElementById('delete-modal-task-name');
      const deleteModalTaskDesc = document.getElementById('delete-modal-task-desc');
      const deleteNo = document.getElementById('delete-no');
      const deleteYes = document.getElementById('delete-yes');

      // Close all dropdown menus
      function closeAllDropdowns() {
        document.querySelectorAll('.dropdown-menu').forEach(menu => {
          menu.classList.add('hidden');
        });
      }

      // Toggle dropdown menu on more_vert button click
      document.querySelectorAll('.more-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const dropdown = this.nextElementSibling;
          const isHidden = dropdown.classList.contains('hidden');
          closeAllDropdowns();
          if (isHidden) {
            dropdown.classList.remove('hidden');
          }
        });
      });

      // Close dropdown on outside click
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.more-btn') && !e.target.closest('.dropdown-menu')) {
          closeAllDropdowns();
        }
      });

      // Show delete confirmation modal
      function showDeleteModal(taskName, taskDesc) {
        deleteModalTaskName.textContent = taskName;
        deleteModalTaskDesc.textContent = taskDesc;
        deleteModal.classList.remove('opacity-0', 'pointer-events-none');
        deleteModal.classList.add('opacity-100');
        deleteModalBox.classList.remove('scale-95');
        deleteModalBox.classList.add('scale-100');
      }

      // Hide delete confirmation modal
      function hideDeleteModal() {
        deleteModal.classList.remove('opacity-100');
        deleteModal.classList.add('opacity-0', 'pointer-events-none');
        deleteModalBox.classList.remove('scale-100');
        deleteModalBox.classList.add('scale-95');
      }

      let taskToDelete = null;

      // Delete button in dropdown → show modal
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const taskItem = this.closest('.task-item');
          taskToDelete = taskItem;
          const taskName = taskItem.dataset.taskName || '';
          const taskDesc = taskItem.dataset.taskDesc || '';
          closeAllDropdowns();
          showDeleteModal(taskName, taskDesc);
        });
      });

      // "いいえ" button → close modal
      deleteNo.addEventListener('click', hideDeleteModal);

      // "はい" button → delete task visually and show alert
      deleteYes.addEventListener('click', function() {
        if (taskToDelete) {
          taskToDelete.remove();
          taskToDelete = null;
          alert('ゴミ箱に移動しました');
        }
        hideDeleteModal();
      });

      // Click overlay to close modal
      deleteModal.addEventListener('click', function (e) {
        if (e.target === deleteModal) {
          hideDeleteModal();
        }
      });
    })();
  </script>
