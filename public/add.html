<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TODO - タスク追加 (画面4)</title>
  <meta name="description" content="TODO Web Application - タスク追加画面" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="create.css?v=4" />
  <style>
    .icon-filled {
      font-variation-settings: 'FILL' 1;
    }
    .input-focus-ring:focus {
      outline: none;
      border-width: 3px !important;
      border-color: #0000ff !important;
    }
    /* Star rating */
    .star-btn {
      cursor: pointer;
      transition: transform 0.15s ease;
      color: #d1d5db;
    }
    .star-btn:hover,
    .star-btn.active {
      color: #FFC107;
      transform: scale(1.15);
    }
    .star-btn .material-symbols-outlined {
      font-size: 36px;
    }
    .star-btn.active .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.6;
      cursor: pointer;
    }
  </style>
</head>

<body class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-surface relative overflow-x-hidden" style="background-color: rgb(255, 255, 255);">
  <!-- Decorative background bubbles -->
  <div class="bubble-top-right"></div>
  <div class="bubble-bottom-left"></div>

  <!-- TopAppBar -->
  <header
    class="bg-pastel-blue h-header-height w-full flex items-center justify-center px-4 md:px-container-margin fixed top-0 left-0 z-50 shadow-sm">
    <!-- Brand / Title -->
    <a href="login.html" class="font-display-header text-display-header text-white" style="color: #FFF100;">TODO</a>

    <!-- Trailing Action -->
    <button
      id="account-btn"
      class="absolute right-4 md:right-container-margin text-[#0000ff] bg-white rounded-full hover:opacity-80 transition-opacity flex items-center justify-center cursor-pointer"
      type="button" aria-label="アカウント">
      <span class="material-symbols-outlined icon-filled" style="font-size: 28px;">account_circle</span>
    </button>
  </header>

  <!-- Main Content Canvas -->
  <main class="flex-grow pt-header-height flex flex-col items-center justify-center px-container-margin w-full max-w-[800px] mx-auto py-10 relative z-10">
    <div class="w-full bg-[#f9f9f9] p-6 sm:p-8 border-2 border-[#a0d8ef] rounded-3xl shadow-sm">
      <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-[#454558] mb-6 text-center">タスク新規追加</h2>
      
      <!-- Input Form -->
      <form id="task-form" class="flex flex-col gap-6" novalidate>
        <!-- Task Name Input -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-primary" for="task-name">
            タスク名 <span class="text-error font-bold">*</span>
          </label>
          <input
            class="w-full bg-[#fff9c4] rounded-2xl border-2 border-[#a0d8ef] text-[#1e293b] font-input-text text-input-text p-4 px-6 focus:border-[3px] focus:outline-none placeholder:text-[#1e293b]/50 transition-all duration-200"
            id="task-name"
            name="task-name"
            placeholder="タスク名を入力"
            type="text"
            required
          />
          <p id="task-name-error" class="text-error text-xs mt-1 px-2 hidden font-medium"></p>
        </div>

        <!-- Priority (Stars) -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-primary">
            重要度 <span class="text-error font-bold">*</span>
          </label>
          <div class="flex gap-2 px-1" id="star-container">
            <button class="star-btn" type="button" data-value="1" aria-label="重要度1">
              <span class="material-symbols-outlined">star</span>
            </button>
            <button class="star-btn" type="button" data-value="2" aria-label="重要度2">
              <span class="material-symbols-outlined">star</span>
            </button>
            <button class="star-btn" type="button" data-value="3" aria-label="重要度3">
              <span class="material-symbols-outlined">star</span>
            </button>
          </div>
          <input type="hidden" id="priority" name="priority" value="0" />
          <p id="priority-error" class="text-error text-xs mt-1 px-2 hidden font-medium"></p>
        </div>

        <!-- Due Date & Time -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-primary" for="due-date">
            期日 <span class="text-error font-bold">*</span>
          </label>
          <div class="flex gap-2">
            <input
              class="flex-1 bg-[#fff9c4] rounded-2xl border-2 border-[#a0d8ef] text-[#1e293b] font-input-text text-input-text p-4 px-6 focus:border-[3px] focus:outline-none placeholder:text-[#1e293b]/50 transition-all duration-200"
              id="due-date"
              name="due-date"
              type="date"
              required
            />
            <input
              class="w-[140px] bg-[#fff9c4] rounded-2xl border-2 border-[#a0d8ef] text-[#1e293b] font-input-text text-input-text p-4 px-6 focus:border-[3px] focus:outline-none placeholder:text-[#1e293b]/50 transition-all duration-200 text-center"
              id="due-time"
              name="due-time"
              type="text"
              inputmode="numeric"
              placeholder="12:00"
              maxlength="5"
              required
            />
          </div>
          <p id="due-date-error" class="text-error text-xs mt-1 px-2 hidden font-medium"></p>
        </div>

        <!-- Task Description Input -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-primary" for="task-desc">
            タスク内容 <span class="text-error font-bold">*</span>
          </label>
          <textarea
            class="w-full bg-[#fff9c4] rounded-2xl border-2 border-[#a0d8ef] text-[#1e293b] font-input-text text-input-text p-4 px-6 focus:border-[3px] focus:outline-none placeholder:text-[#1e293b]/50 transition-all duration-200 resize-y"
            id="task-desc"
            name="task-desc"
            placeholder="タスクの詳細を入力"
            rows="5"
            required
          ></textarea>
          <p id="task-desc-error" class="text-error text-xs mt-1 px-2 hidden font-medium"></p>
        </div>

        <!-- Category Select -->
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-primary" for="task-category">
            カテゴリー
          </label>
          <select
            id="task-category"
            class="w-full bg-[#fff9c4] rounded-2xl border-2 border-[#a0d8ef] text-[#1e293b] font-input-text text-input-text p-4 px-6 focus:border-[3px] focus:outline-none transition-all duration-200 cursor-pointer"
          >
            <option value="">カテゴリーを選択（任意）</option>
          </select>
          <button
            id="add-new-category-btn"
            type="button"
            class="flex items-center gap-1 text-[#0000ff] font-label-bold text-[13px] hover:opacity-70 transition-opacity w-fit cursor-pointer"
          >
            <span class="material-symbols-outlined text-[18px]">add_circle</span>
            新しいカテゴリーを作成
          </button>
        </div>

        <!-- 全体エラー / ログイン催促メッセージエリア -->
        <div id="general-error" class="hidden p-3 bg-error-container text-error rounded-xl text-sm font-medium text-center"></div>

        <!-- Actions Container -->
        <div class="flex justify-end items-center mt-4 gap-4">
          <button
            id="cancel-btn"
            class="border-2 border-[#a0d8ef] text-[#426AB3] rounded-full font-label-bold text-label-bold min-h-[48px] px-8 py-3 hover:bg-[#a0d8ef]/20 transition-all flex items-center justify-center cursor-pointer"
            type="button"
          >
            キャンセル
          </button>
          <button
            id="add-task-btn"
            class="bg-[#a0d8ef] text-white hover:bg-[#426ab3] active:scale-95 rounded-full font-label-bold text-label-bold min-h-[48px] px-8 py-3 transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
            type="submit"
          >
            <span id="add-task-btn-text">追加</span>
            <span class="material-symbols-outlined text-[20px]">add_task</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay"
    class="fixed inset-0 bg-black/40 z-[60] opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed right-0 top-0 h-full w-[280px] z-[70] bg-[#f4f3f3] shadow-[-4px_0_24px_rgba(0,0,0,0.08)] flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
    <!-- Sidebar Header -->
    <div class="h-[64px] flex items-center px-6 border-b border-[#c5c4db]/30">
      <span class="material-symbols-outlined icon-filled text-[#0000ff] mr-3" style="font-size: 28px;">account_circle</span>
      <span class="font-label-bold text-label-bold text-on-surface">アカウント</span>
    </div>

    <!-- Sidebar Content -->
    <div class="flex-1 px-6 py-6">
      <nav class="flex flex-col gap-1">
        <a href="dust.html" class="flex items-center gap-2 px-4 py-3 rounded-full transition-all hover:bg-[#e2e2e2] w-full text-on-surface">
          <span class="material-symbols-outlined">delete</span>
          <span class="font-label-bold">ゴミ箱</span>
        </a>
        <a href="categories.html" class="flex items-center gap-2 px-4 py-3 rounded-full transition-all hover:bg-[#e2e2e2] w-full text-on-surface">
          <span class="material-symbols-outlined">label</span>
          <span class="font-label-bold">カテゴリー</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar Footer - Logout -->
    <div class="px-6 py-6 border-t border-[#c5c4db]/30">
      <button id="logout-btn"
        class="w-full py-3 px-6 rounded-full text-[#ba1a1a] font-label-bold text-label-bold hover:bg-[#ffdad6] transition-colors duration-200 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-sm">logout</span>
        ログアウト
      </button>
    </div>
  </aside>

  <!-- Logout Confirmation Modal -->
  <div id="logout-modal"
    class="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-opacity duration-200">
    <div data-modal-box
      class="bg-white rounded-2xl p-8 shadow-xl max-w-sm w-[90%] flex flex-col items-center gap-6 transform scale-95 transition-transform duration-200">
      <span class="material-symbols-outlined text-[#ba1a1a]" style="font-size: 40px;">logout</span>
      <p class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center">本当にログアウトしますか？</p>
      <div class="flex gap-4 w-full">
        <button id="logout-no"
          class="flex-1 py-3 px-6 rounded-full border-2 border-[#a0d8ef] text-on-surface font-label-bold text-label-bold hover:bg-[#a0d8ef]/10 transition-colors duration-200">
          いいえ
        </button>
        <button id="logout-yes"
          class="flex-1 py-3 px-6 rounded-full bg-[#ba1a1a] text-white font-label-bold text-label-bold hover:opacity-90 transition-opacity duration-200">
          はい
        </button>
      </div>
    </div>
  </div>

  <!-- Star Rating Logic -->
  <script>
    (function () {
      const stars = document.querySelectorAll('.star-btn');
      const priorityInput = document.getElementById('priority');
      let currentRating = 0;

      function updateStars(rating) {
        stars.forEach((btn) => {
          const val = parseInt(btn.dataset.value);
          if (val <= rating) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        currentRating = rating;
        priorityInput.value = rating;
        priorityInput.dispatchEvent(new Event('change'));
      }

      stars.forEach((btn) => {
        btn.addEventListener('click', () => {
          const val = parseInt(btn.dataset.value);
          if (val === currentRating) {
            updateStars(0);
          } else {
            updateStars(val);
          }
        });

        btn.addEventListener('mouseenter', () => {
          const val = parseInt(btn.dataset.value);
          stars.forEach((b) => {
            b.classList.toggle('active', parseInt(b.dataset.value) <= val);
          });
        });

        btn.addEventListener('mouseleave', () => {
          updateStars(currentRating);
        });
      });
    })();
  </script>

  <!-- Category Create Modal -->
  <div id="create-category-modal-overlay"
    class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="create-category-modal-box"
      class="bg-[#f9f9f9] w-[90%] max-w-[400px] rounded-3xl border-2 border-[#a0d8ef] p-6 shadow-lg flex flex-col gap-5 transform scale-95 transition-transform duration-200">
      <div class="text-center">
        <span class="material-symbols-outlined text-[#0000ff] text-[40px] mb-1">label</span>
        <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">新しいカテゴリー</h2>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-label-bold text-label-bold text-primary" for="new-category-name">
          カテゴリー名 <span class="text-error font-bold">*</span>
        </label>
        <input
          id="new-category-name"
          type="text"
          maxlength="30"
          placeholder="カテゴリー名を入力（最大30文字）"
          class="w-full bg-[#fff9c4] rounded-2xl border-2 border-[#a0d8ef] text-[#1e293b] font-input-text text-[16px] p-3 px-5 focus:border-[3px] focus:border-[#0000ff] focus:outline-none placeholder:text-[#1e293b]/50 transition-all duration-200"
        />
        <p id="create-category-error" class="text-error text-xs px-1 hidden font-medium"></p>
      </div>
      <div class="flex gap-4">
        <button id="create-category-cancel"
          class="flex-1 py-3 rounded-3xl bg-[#f9f9f9] text-[#1e293b] border border-[#a0d8ef] font-label-bold cursor-pointer hover:bg-[#e2e2e2] transition-colors">
          キャンセル
        </button>
        <button id="create-category-submit"
          class="flex-1 py-3 rounded-3xl bg-[#a0d8ef] text-white border-none font-label-bold cursor-pointer hover:bg-[#426ab3] transition-colors">
          作成
        </button>
      </div>
    </div>
  </div>

  <!-- Sidebar Logic -->
  <script src="sidebar.js"></script>
  <!-- Task Creation Logic Script -->
  <script type="module" src="add.js?v=1"></script>
</body>

</html>
