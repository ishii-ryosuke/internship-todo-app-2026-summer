<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TODO - 新規登録</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="page2.css?v=4" />
</head>

<body
  class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-surface relative overflow-x-hidden"
  style="background-color: rgb(255, 255, 255);">
  <!-- Decorative Bubbles -->
  <div class="bubble-top-right"></div>
  <div class="bubble-bottom-left"></div>

  <!-- TopAppBar -->
  <header
    class="bg-pastel-blue h-header-height w-full flex items-center justify-center px-container-margin fixed top-0 left-0 z-50 shadow-sm">
    <a href="login.html" class="font-display-header text-display-header text-white" style="color: #FFF100;">TODO</a>
  </header>

  <!-- Main Content -->
  <main
    class="flex-grow pt-header-height flex flex-col items-center justify-center px-container-margin w-full max-w-[800px] mx-auto pb-12 relative z-10">
    <div class="w-full max-w-md bg-surface p-8 border-2 border-[#a0d8ef] rounded-3xl mt-8 mb-6 shadow-sm">
      <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-[#454558] mb-6 text-center">新規アカウント作成</h2>

      <form id="signup-form" class="flex flex-col gap-base" novalidate>
        <!-- メールアドレス -->
        <div class="flex flex-col">
          <label class="font-label-bold text-label-bold text-[#454558] mb-2" for="email">
            メールアドレス <span class="text-error font-bold">*</span>
          </label>
          <input
            class="border-2 border-[#a0d8ef] bg-[#fffacd] rounded-full text-[#454558] p-4 px-6 font-input-text text-input-text focus:border-[3px] focus:outline-none placeholder:text-[#454558]/50 transition-all duration-200"
            id="email" name="email" placeholder="name@example.com" type="email" required autocomplete="email" />
          <p id="email-error" class="text-error text-xs mt-1.5 px-3 hidden font-medium"></p>
        </div>

        <!-- パスワード -->
        <div class="flex flex-col mt-4">
          <label class="font-label-bold text-label-bold text-[#454558] mb-2" for="password">
            パスワード <span class="text-error font-bold">*</span> <span
              class="text-xs text-[#757589] font-normal">（英数混合8文字以上）</span>
          </label>
          <div class="relative flex items-center">
            <input
              class="w-full border-2 border-[#a0d8ef] bg-[#fffacd] rounded-full text-[#454558] p-4 pl-6 pr-12 font-input-text text-input-text focus:border-[3px] focus:outline-none placeholder:text-[#454558]/50 transition-all duration-200"
              id="password" name="password" placeholder="••••••••" type="password" required
              autocomplete="new-password" />
            <button type="button" id="toggle-password"
              class="absolute right-4 text-[#757589] hover:text-[#454558] focus:outline-none p-1 flex items-center justify-center transition-colors"
              aria-label="パスワードの表示切替">
              <span class="material-symbols-outlined text-xl" id="toggle-password-icon">visibility_off</span>
            </button>
          </div>
          <p id="password-error" class="text-error text-xs mt-1.5 px-3 hidden font-medium"></p>
        </div>

        <!-- パスワード（確認用） -->
        <div class="flex flex-col mt-4">
          <label class="font-label-bold text-label-bold text-[#454558] mb-2" for="confirm-password">
            パスワード（確認用） <span class="text-error font-bold">*</span>
          </label>
          <div class="relative flex items-center">
            <input
              class="w-full border-2 border-[#a0d8ef] bg-[#fffacd] rounded-full text-[#454558] p-4 pl-6 pr-12 font-input-text text-input-text focus:border-[3px] focus:outline-none placeholder:text-[#454558]/50 transition-all duration-200"
              id="confirm-password" name="confirm-password" placeholder="••••••••" type="password" required
              autocomplete="new-password" />
            <button type="button" id="toggle-confirm-password"
              class="absolute right-4 text-[#757589] hover:text-[#454558] focus:outline-none p-1 flex items-center justify-center transition-colors"
              aria-label="確認用パスワードの表示切替">
              <span class="material-symbols-outlined text-xl" id="toggle-confirm-password-icon">visibility_off</span>
            </button>
          </div>
          <p id="confirm-password-error" class="text-error text-xs mt-1.5 px-3 hidden font-medium"></p>
        </div>

        <!-- ニックネーム（任意） -->
        <div class="flex flex-col mt-4">
          <label class="font-label-bold text-label-bold text-[#454558] mb-2 flex items-center justify-between"
            for="nickname">
            <span>ニックネーム</span>
            <span class="text-xs text-[#757589] font-normal">（任意）</span>
          </label>
          <input
            class="border-2 border-[#a0d8ef] bg-[#fffacd] rounded-full text-[#454558] p-4 px-6 font-input-text text-input-text focus:border-[3px] focus:outline-none placeholder:text-[#454558]/50 transition-all duration-200"
            id="nickname" name="nickname" placeholder="ニックネームを入力" type="text" autocomplete="nickname" />
          <p id="nickname-error" class="text-error text-xs mt-1.5 px-3 hidden font-medium"></p>
        </div>

        <!-- 全体エラーメッセージ表示エリア -->
        <div id="general-error"
          class="hidden p-3 mt-4 bg-error-container text-error rounded-xl text-xs font-medium text-center"></div>

        <!-- 送信ボタン -->
        <div class="flex justify-end mt-8">
          <button id="submit-btn"
            class="btn-inactive font-label-bold text-label-bold min-h-[48px] px-8 py-3 rounded-full flex items-center justify-center gap-2 border-2 text-white disabled:opacity-50 disabled:cursor-not-allowed"
            type="submit">
            <span id="submit-btn-text" class="text-white">入力完了</span>
            <span class="material-symbols-outlined text-white"
              style='font-variation-settings: "FILL" 1;'>arrow_forward</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Google Sign-in & Login Link Area (新規アカウント作成枠の下) -->
    <div class="w-full max-w-md flex flex-col items-center gap-4">
      <button id="google-signin-btn" type="button"
        class="w-full bg-surface text-[#454558] border-2 border-[#a0d8ef] rounded-full font-label-bold text-label-bold min-h-[48px] px-6 py-3 hover:bg-primary-fixed active:scale-95 transition-all duration-200 flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4"></path>
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853"></path>
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            fill="#FBBC05"></path>
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335"></path>
        </svg>
        <span id="google-btn-text">Googleで登録</span>
      </button>

      <a href="login.html"
        class="bg-pastel-blue text-white font-label-bold text-label-bold px-container-margin py-[12px] min-h-[48px] rounded-lg hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center w-full max-w-md mx-auto">
        アカウントをお持ちの方はこちら
      </a>
    </div>
  </main>

  <!-- External JS module -->
  <script type="module" src="page2.js?v=4"></script>
</body>

</html>
