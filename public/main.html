<!DOCTYPE html>
<html class="light" lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TODO - タスクリスト (画面3)</title>
  <meta name="description" content="TODO Web Application - タスク一覧画面" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="login.css" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-fixed-dim": "#bec2ff",
            "surface-container-high": "#e8e8e8",
            "on-tertiary-fixed": "#410000",
            "primary": "#0001bb",
            "on-secondary-fixed": "#1d1d00",
            "inverse-primary": "#bec2ff",
            "on-error": "#ffffff",
            "error": "#ba1a1a",
            "inverse-on-surface": "#f0f1f1",
            "border-primary": "#0000ff",
            "outline": "#757589",
            "on-primary-fixed": "#00006e",
            "surface-container": "#eeeeee",
            "tertiary-container": "#9d0002",
            "on-tertiary": "#ffffff",
            "secondary-fixed-dim": "#cdcd00",
            "primary-fixed": "#e0e0ff",
            "background": "#f9f9f9",
            "surface-container-highest": "#e2e2e2",
            "primary-container": "#0000ff",
            "on-surface": "#1a1c1c",
            "on-tertiary-fixed-variant": "#930002",
            "text-on-accent": "#666600",
            "on-secondary-fixed-variant": "#494900",
            "on-surface-variant": "#454558",
            "on-primary": "#ffffff",
            "surface-container-low": "#f3f3f4",
            "on-error-container": "#93000a",
            "on-primary-container": "#b3b7ff",
            "surface-bright": "#f9f9f9",
            "surface-dim": "#dadada",
            "on-tertiary-container": "#ffa598",
            "on-primary-fixed-variant": "#0000ef",
            "tertiary-fixed-dim": "#ffb4a9",
            "surface": "#f9f9f9",
            "secondary-fixed": "#eaea0a",
            "tertiary": "#720001",
            "outline-variant": "#c5c4db",
            "secondary": "#626200",
            "on-secondary": "#ffffff",
            "surface-lowest": "#ffffff",
            "inverse-surface": "#2f3131",
            "surface-tint": "#343dff",
            "surface-variant": "#e2e2e2",
            "secondary-container": "#e7e700",
            "tertiary-fixed": "#ffdad5",
            "error-container": "#ffdad6",
            "surface-container-lowest": "#ffffff",
            "on-background": "#1a1c1c",
            "on-secondary-container": "#666600",
            "pastel-blue": "#a0d8ef",
            "bubble-blue": "#a0d8ef",
            "bubble-yellow": "#fff59d"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "stack-gap": "24px",
            "container-margin": "24px",
            "input-padding": "16px 20px",
            "base-gap": "8px",
            "gutter": "16px",
            "header-height": "64px"
          },
          fontFamily: {
            "headline-lg-mobile": ["Work Sans", "sans-serif"],
            "input-text": ["Work Sans", "sans-serif"],
            "headline-lg": ["Work Sans", "sans-serif"],
            "display-header": ["Work Sans", "sans-serif"],
            "label-bold": ["Work Sans", "sans-serif"],
            "body-md": ["Work Sans", "sans-serif"]
          },
          fontSize: {
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "input-text": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
            "display-header": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700" }],
            "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
          }
        }
      }
    };
  </script>
  <style>
    .icon-filled {
      font-variation-settings: 'FILL' 1;
    }

    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
  </style>
</head>

<body
  class="bg-surface-lowest min-h-screen flex flex-col font-body-md text-on-background relative overflow-x-hidden">
  <!-- Decorative background bubbles -->
  <div class="bubble-tr"></div>
  <div class="bubble-bl"></div>

  <!-- TopAppBar -->
  <header
    class="bg-pastel-blue h-header-height w-full flex items-center justify-center px-4 md:px-container-margin fixed top-0 left-0 z-50 shadow-sm">
    <!-- Brand / Title -->
    <a href="login.html" class="font-display-header text-display-header text-white"
      style="color: #FFF100;">TODO</a>

    <!-- Trailing Action -->
    <button id="account-btn"
      class="absolute right-4 md:right-container-margin text-[#0000ff] bg-white rounded-full hover:opacity-80 transition-opacity flex items-center justify-center cursor-pointer"
      type="button" aria-label="アカウント">
      <span class="material-symbols-outlined icon-filled" style="font-size: 28px;">account_circle</span>
    </button>
  </header>

  <!-- Main Content Canvas (Fixed Grid approach for desktop max-width 800px) -->
  <main
    class="w-full max-w-[800px] mx-auto pt-[88px] pb-[120px] px-container-margin md:pb-container-margin flex flex-col items-center relative z-10">
    <!-- Filter UI -->
    <div class="w-full relative mb-2" id="filter-container">
      <button
        id="filter-btn"
        type="button"
        class="w-full flex items-center justify-between bg-white border-2 border-[#a0d8ef] rounded-2xl px-5 py-3 font-label-bold text-label-bold text-on-surface shadow-sm hover:bg-[#f0faff] transition-colors cursor-pointer"
        aria-haspopup="listbox"
        aria-expanded="false"
      >
        <span id="filter-label">未完了</span>
        <span id="filter-chevron" class="material-symbols-outlined text-[#0000ff] transition-transform duration-200">expand_more</span>
      </button>
      <ul
        id="filter-dropdown"
        role="listbox"
        class="hidden absolute left-0 right-0 top-[calc(100%+4px)] z-30 bg-white border-2 border-[#a0d8ef] rounded-2xl shadow-lg overflow-hidden"
      >
        <li
          role="option"
          data-filter="incomplete"
          class="filter-option px-5 py-3 font-label-bold text-label-bold text-on-surface cursor-pointer hover:bg-[#e8f7fd] transition-colors"
        >未完了</li>
        <li
          role="option"
          data-filter="completed"
          class="filter-option px-5 py-3 font-label-bold text-label-bold text-on-surface cursor-pointer hover:bg-[#e8f7fd] transition-colors"
        >完了済み</li>
        <li
          role="option"
          data-filter="all"
          class="filter-option px-5 py-3 font-label-bold text-label-bold text-on-surface cursor-pointer hover:bg-[#e8f7fd] transition-colors"
        >すべて表示</li>
      </ul>
    </div>

    <!-- Task List (Dynamic) -->
    <div id="task-list" class="w-full flex flex-col gap-[12px]"></div>
  </main>

  <!-- Floating Action Button (FAB) -->
  <a href="add.html" aria-label="タスク追加"
    class="fixed bottom-[104px] md:bottom-container-margin right-container-margin md:right-[calc(50%-400px+24px)] w-[64px] h-[64px] bg-[#a0d8ef] rounded-full border-none flex items-center justify-center shadow-lg hover:bg-[#426ab3] hover:text-white active:scale-95 transition-all z-40 cursor-pointer">
    <span class="material-symbols-outlined text-white text-[32px]">add</span>
  </a>

  <!-- BottomNavBar (Mobile Only Shell) -->
  <nav
    class="md:hidden fixed bottom-0 left-0 w-full z-50 h-[80px] bg-surface-container-lowest border-t-2 border-[#a0d8ef] flex justify-around items-center px-4 transition-all duration-200 ease-in-out">
    <!-- Active Tab: Tasks -->
    <div aria-current="page"
      class="flex flex-col items-center justify-center bg-[#a0d8ef] text-[#0001bb] rounded-2xl p-2 w-[80px] cursor-pointer">
      <span class="material-symbols-outlined icon-filled mb-1">list_alt</span>
      <span class="font-label-bold text-[12px]">タスク</span>
    </div>
    <!-- Inactive Tab: Calendar -->
    <div
      class="flex flex-col items-center justify-center text-[#0000ff] p-2 w-[80px] cursor-pointer hover:bg-[#a0d8ef] hover:text-[#0001bb] rounded-2xl transition-colors">
      <span class="material-symbols-outlined mb-1">calendar_today</span>
      <span class="font-label-bold text-[12px]">カレンダー</span>
    </div>
    <!-- Inactive Tab: Settings -->
    <div
      class="flex flex-col items-center justify-center text-[#0000ff] p-2 w-[80px] cursor-pointer hover:bg-[#a0d8ef] hover:text-[#0001bb] rounded-2xl transition-colors">
      <span class="material-symbols-outlined mb-1">settings</span>
      <span class="font-label-bold text-[12px]">設定</span>
    </div>
  </nav>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay"
    class="fixed inset-0 bg-black/40 z-[60] opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed right-0 top-0 h-full w-[280px] z-[70] bg-[#f4f3f3] shadow-[-4px_0_24px_rgba(0,0,0,0.08)] flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
    <!-- Sidebar Header -->
    <div class="h-[64px] flex items-center px-6 border-b border-[#c5c4db]/30">
      <span class="material-symbols-outlined icon-filled text-[#0000ff] mr-3"
        style="font-size: 28px;">account_circle</span>
      <span class="font-label-bold text-label-bold text-on-surface">アカウント</span>
    </div>

    <!-- Sidebar Content -->
    <div class="flex-1 px-6 py-6">
      <nav class="flex flex-col gap-1">
        <a href="dust.html" class="flex items-center gap-2 px-4 py-3 rounded-full transition-all hover:bg-[#e2e2e2] w-full text-on-surface">
          <span class="material-symbols-outlined">delete</span>
          <span class="font-label-bold">ゴミ箱</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar Footer - Logout -->
    <div class="px-6 py-6 border-t border-[#c5c4db]/30">
      <button id="logout-btn"
        class="w-full py-3 px-6 rounded-full text-[#ba1a1a] font-label-bold text-label-bold hover:bg-[#ffdad6] transition-colors duration-200 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-sm">logout</span>
        ログアウト
      </button>
    </div>
  </aside>

  <!-- Logout Confirmation Modal -->
  <div id="logout-modal"
    class="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 opacity-0 pointer-events-none transition-opacity duration-200">
    <div data-modal-box
      class="bg-white rounded-2xl p-8 shadow-xl max-w-sm w-[90%] flex flex-col items-center gap-6 transform scale-95 transition-transform duration-200">
      <span class="material-symbols-outlined text-[#ba1a1a]" style="font-size: 40px;">logout</span>
      <p class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center">本当にログアウトしますか？</p>
      <div class="flex gap-4 w-full">
        <button id="logout-yes"
          class="flex-1 py-3 px-6 rounded-full bg-[#ba1a1a] text-white font-label-bold text-label-bold hover:opacity-90 transition-opacity duration-200">
          はい
        </button>
        <button id="logout-no"
          class="flex-1 py-3 px-6 rounded-full border-2 border-[#a0d8ef] text-on-surface font-label-bold text-label-bold hover:bg-[#a0d8ef]/10 transition-colors duration-200">
          いいえ
        </button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="delete-modal-box" class="bg-[#f9f9f9] w-[90%] max-w-[400px] rounded-3xl border-2 border-[#a0d8ef] p-6 shadow-lg flex flex-col gap-6 transform scale-95 transition-transform duration-200">
      <div class="text-center">
        <span class="material-symbols-outlined text-[#ba1a1a] text-[48px] mb-2">warning</span>
        <p class="text-on-surface font-bold text-[18px]">本当に削除しますか？</p>
        <div class="mt-4 p-4 bg-surface-container-low rounded-2xl border border-[#a0d8ef] text-left">
          <p id="delete-modal-title" class="font-bold text-on-surface text-[16px] mb-1"></p>
          <p id="delete-modal-desc" class="text-on-surface-variant text-[14px] opacity-80 leading-relaxed"></p>
        </div>
      </div>
      <div class="flex gap-4">
        <button id="delete-modal-yes" class="flex-1 py-3 rounded-2xl bg-[#ff0000] text-[#ffffff] border-none font-label-bold cursor-pointer hover:opacity-90 transition-opacity">はい</button>
        <button id="delete-modal-no" class="flex-1 py-3 rounded-2xl bg-[#f9f9f9] text-[#1e293b] border border-[#a0d8ef] font-label-bold cursor-pointer hover:bg-[#e2e2e2] transition-colors">いいえ</button>
      </div>
    </div>
  </div>

  <!-- Sidebar Logic -->
  <script src="sidebar.js"></script>
  <!-- Task List Logic Script -->
  <script type="module" src="main.js?v=1"></script>
</body>

</html>
