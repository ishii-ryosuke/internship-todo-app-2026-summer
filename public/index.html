    <div class="w-full max-w-md bg-surface-container-lowest p-container-margin rounded-xl border-2 border-pastel-blue flex flex-col gap-[20px] shadow-sm">
      <div class="text-center mb-[4px]">
        <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-pastel-blue">ログイン</h2>
      </div>

      <!-- Input Form (Design Only, Submissions Prevented) -->
      <form class="flex flex-col gap-[16px]" onsubmit="return false;">
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-pastel-blue sr-only" for="email">メールアドレス</label>
          <input class="w-full bg-[#fff9c4] border-2 border-pastel-blue p-input-padding font-input-text text-input-text text-on-surface placeholder:text-on-surface/50 input-focus-ring rounded-lg transition-all duration-200" id="email" name="email" placeholder="メールアドレス" type="email" autocomplete="email"/>
        </div>
        <div class="flex flex-col gap-base">
          <label class="font-label-bold text-label-bold text-pastel-blue sr-only" for="password">パスワード</label>
          <input class="w-full bg-[#fff9c4] border-2 border-pastel-blue p-input-padding font-input-text text-input-text text-on-surface placeholder:text-on-surface/50 input-focus-ring rounded-lg transition-all duration-200" id="password" name="password" placeholder="パスワード" type="password" autocomplete="current-password"/>
        </div>

        <!-- Action Buttons Area -->
        <div class="flex items-center justify-between mt-[8px] gap-2">
          <a class="font-label-bold text-label-bold text-pastel-blue hover:opacity-80 transition-opacity text-xs sm:text-sm" href="#">
            アカウントをお持ちでない方はこちら
          </a>
          <button class="bg-pastel-blue text-white font-label-bold text-label-bold px-container-margin py-[12px] min-h-[48px] rounded-lg hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 shrink-0 cursor-pointer" type="button">
            <span>ログイン</span>
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center my-2 gap-3">
          <div class="flex-grow h-px bg-pastel-blue/40"></div>
          <span class="text-xs text-pastel-blue font-semibold">または</span>
          <div class="flex-grow h-px bg-pastel-blue/40"></div>
        </div>

        <!-- Google Login Button (Design Only / Functionless) -->
        <button class="w-full bg-surface-container-lowest border-2 border-pastel-blue text-pastel-blue font-label-bold text-label-bold min-h-[48px] flex items-center justify-center gap-2 hover:bg-pastel-blue hover:text-white transition-all duration-200 rounded-full cursor-pointer py-3" type="button">
